<app-menu></app-menu>
  

  <div class="dashboard-container">
   
    <header class="header">
      <h1 class="titulo-dashboard">Dashboard FORD</h1>
    </header>

  
    <section class="cards-row">
      
      <div class="card card-veiculo">
        <div class="card-header">Veículo</div>
        <div class="card-body">
          <div class="custom-select" id="veiculo-select-container">
            <div class="select-selected">Mustang <span class="arrow">&#711;</span></div>
            <ul class="select-items">
              <li>Ranger</li>
              <li class="active">Mustang</li>
              <li>Territory</li>
              <li>Bronco Sport</li>
            </ul>
          </div>
        </div>
      </div>

    
      <div class="card">
        <div class="card-header">Total de Vendas</div>
        <div class="card-body info-body">
          <span class="card-value" id="val-vendas">1500</span>
          <span class="card-unit">Unid.</span>
        </div>
      </div>

     
      <div class="card">
        <div class="card-header">Conectados</div>
        <div class="card-body info-body">
          <span class="card-value" id="val-conectados">500</span>
          <span class="card-unit">Unid.</span>
        </div>
      </div>


      <div class="card">
        <div class="card-header">Update Software</div>
        <div class="card-body info-body">
          <span class="card-value" id="val-update">750</span>
          <span class="card-unit">Unid.</span>
        </div>
      </div>
    </section>

    <section class="image-section">
      <img id="carro-img" src="/assets/img/mustang.png" alt="Ford Mustang" />
    </section>

    <section class="table-section">
      <table class="data-table">
        <thead>
          <tr>
            <th>Código - Vin</th>
            <th>Odômetro</th>
            <th>Nível de Combustível</th>
            <th>Status</th>
            <th>Lat.</th>
            <th>Long.</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <input type="text" class="vin-input" id="tabela-vin" value="2FRHDUYS2Y63NHD22455" readonly />
            </td>
            <td><strong id="tabela-odo">50000 Km</strong></td>
            <td><strong id="tabela-comb">90 %</strong></td>
            <td><strong id="tabela-status">on</strong></td>
            <td><strong id="tabela-lat">-12,2322</strong></td>
            <td><strong id="tabela-long">-35,2314</strong></td>
          </tr>
        </tbody>
      </table>
      <div class="table-bottom-line"></div>
    </section>
  </div>

  <script src="/js/dashboard.js"></script>
